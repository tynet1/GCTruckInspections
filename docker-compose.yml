name: gc-inspections

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gc_inspections}
      TZ: ${TZ:-America/Phoenix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    # A small init process as PID 1 cleans up the exited helper processes Chromium leaves behind after PDFs
    # (Node as PID 1 doesn't, so they'd pile up over months).
    init: true
    # Starts as root only so its entrypoint can let the app write to the backup folder, then runs the app as the
    # unprivileged "node" user (scripts/app-entrypoint.sh).
    user: root
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-gc}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-gc_inspections}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      UPLOAD_DAILY_MB: ${UPLOAD_DAILY_MB:-}
      UPLOAD_MIN_FREE_MB: ${UPLOAD_MIN_FREE_MB:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      TZ: ${TZ:-America/Phoenix}
      BACKUP_DIR: /backups
      PRE_MIGRATE_BACKUP: ${PRE_MIGRATE_BACKUP:-}
      UPDATE_CHECK_REPO: ${UPDATE_CHECK_REPO:-}
    volumes:
      - uploads:/data/uploads
      # The app's own backup before database migrations goes next to the nightly ones (src/backup.ts).
      - ${BACKUP_DIR:-./backups}:/backups

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Nightly pg_dump + uploads tarball into BACKUP_DIR, keeping BACKUP_KEEP_DAYS days. Each run is recorded in the
  # database (backup_runs) for Admin → About. After an update, recreate it so it runs the new backup.sh.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # The app creates the tables on start; without this the first backup can run against an empty database.
      app:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-gc}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-gc_inspections}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TZ:-America/Phoenix}
    volumes:
      - uploads:/uploads:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh", "loop"]

  # Optional: public HTTPS hostname without opening ports. Start with --profile tunnel.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - caddy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
